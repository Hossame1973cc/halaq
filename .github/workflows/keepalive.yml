# Keeps the free Supabase project from being paused for inactivity
# by running one small read query every day.
# The key below is the public "anon" key (already public inside the website).
name: Keep Supabase active

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          URL: https://pwasygvgfutdygqkmbkf.supabase.co
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3YXN5Z3ZnZnV0ZHlncWttYmtmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MTQ1NjUsImV4cCI6MjExMDM5MDU2NX0.fCJR5NXuDXqDV89mIVAMO8ferNX8giURZOiF034-YPA
        run: |
          curl -fsS "$URL/rest/v1/shops_directory?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          echo "Supabase is awake"
